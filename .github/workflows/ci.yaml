name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: huijian-mqtt-broker

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ========== 0. 代码质量检查 ==========
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          # 检查所有 shell 脚本语法是否正确
          apt-get update -qq && apt-get install -y -qq shellcheck > /dev/null 2>&1 || true
          for f in huijian_mqtt_broker/run.sh; do
            echo "检查 $f ..."
            bash -n "$f" || exit 1
            shellcheck "$f" || echo "⚠ shellcheck 警告（非阻塞）"
          done

      - name: Check YAML files syntax
        run: |
          pip install -q pyyaml
          python3 -c '
          import yaml, sys, glob
          for f in glob.glob("**/*.yaml", recursive=True):
              try:
                  yaml.safe_load(open(f))
                  print(f"✅ {f}")
              except Exception as e:
                  print(f"❌ {f}: {e}")
                  sys.exit(1)
          '

      - name: Check JSON files syntax
        run: |
          for f in $(find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*"); do
            python3 -c "import json; json.load(open('$f'))" || exit 1
            echo "✅ $f"
          done

      - name: Python syntax & unit tests (v1.6.3 回归护栏)
        run: |
          # 38 个既有单测 + 注册表实参回归测试曾在本地全绿却漏掉 v1.6.0 的
          # "entity" 字面量回归——CI 从未跑过 pytest，本地验证形同虚设。补齐。
          # 依赖说明：services.py 真实 import voluptuous（conftest 只假造
          # homeassistant 包树）；@pytest.mark.asyncio 需要 pytest-asyncio，
          # 缺失时 pytest 会把 async 测试直接判 error。
          pip install -q pytest pytest-asyncio voluptuous
          python3 -m py_compile huijian_mqtt_broker/custom_components/window_controller_gateway/*.py
          python3 -m py_compile huijian_mqtt_broker/mdns_publisher.py
          python3 -m pytest huijian_mqtt_broker/tests -q

      - name: Verify version consistency
        run: |
          VERSION=$(grep '^version:' huijian_mqtt_broker/config.yaml | head -1 | awk -F'"' '{print $2}')
          echo "config.yaml 版本: $VERSION"
          # 检查 index.html 版本一致
          HTML_VER=$(grep "CURRENT_VERSION = '" huijian_mqtt_broker/www/index.html | sed "s/.*CURRENT_VERSION = '\([^']*\)'.*/\1/")
          echo "index.html 版本: $HTML_VER"
          [ "$VERSION" = "$HTML_VER" ] || { echo "❌ 版本不一致"; exit 1; }
          # 检查 version.json 两个字段一致（addon_version 与 integration_version
          # 此前只查前者，manifest.json 完全没查——四处版本一致是 CLAUDE.md 铁律）
          python3 - "$VERSION" <<'PYEOF'
          import json, sys
          want = sys.argv[1]
          vj = json.load(open('huijian_mqtt_broker/www/version.json'))
          mf = json.load(open('huijian_mqtt_broker/custom_components/window_controller_gateway/manifest.json'))
          for label, got in [("version.json.addon_version", vj.get("addon_version")),
                             ("version.json.integration_version", vj.get("integration_version")),
                             ("manifest.json.version", mf.get("version"))]:
              status = "✅" if got == want else "❌"
              print(f"{status} {label}: {got}")
              if got != want:
                  sys.exit(1)
          PYEOF
          echo "✅ 所有版本号一致: $VERSION"

  # ========== 1. 读取版本号 & 准备变更日志 ==========
  prepare:
    name: Prepare
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' huijian_mqtt_broker/config.yaml | head -1 | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到版本号: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # 将 changelog 写入临时文件，避免 echo -e 破坏中文编码（Gitee 乱码根因）
          CHANGELOG_FILE="/tmp/changelog.md"
          
          if [ -f CHANGELOG.md ]; then
            awk -v ver="${{ steps.version.outputs.version }}" '
              /^## \[/{ found=0 }
              $0 ~ "^## \\["ver"]" { found=1; next }
              /^## \[/{ if(found) exit }
              found { print }
            ' CHANGELOG.md | head -50 > "$CHANGELOG_FILE"
          fi
          
          if [ ! -s "$CHANGELOG_FILE" ]; then
            # 从 git log 自动生成 changelog（最近 10 条提交）
            {
              echo "## v${{ steps.version.outputs.version }}"
              echo ""
              git log --oneline -10 --format='- %h: %s'
            } > "$CHANGELOG_FILE"
          fi
          
          # 用文件内容设置输出（避免 echo -e 破坏 UTF-8 中文）
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          cat "$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

  # ========== 2. 构建 Docker 镜像 ==========
  init:
    name: Init
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, init]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "huijian_mqtt_broker"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Manifest
    needs: [prepare, init, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest

      # v1.6.4 定案（实验实锤）：GitHub【没有】visibility 变更 API——
      # REST PUT/PATCH × /user/ 与 /users/{owner}/ 全 404、GraphQL 公开
      # schema 无该 mutation（updateV3RegistryPackage 已被移除）。
      # 但 Actions 用 GITHUB_TOKEN 首推的包【继承仓库可见性】：public 仓库
      # ⇒ 新包自动 public（amd64 删包重建实测 anon 200）。历史包因创建时
      # 走了本地 PAT 推送被永久定死 private，修复手段=删包+重推：
      #   gh api -X DELETE /user/packages/container/<pkg>
      # 探测注意：token 必须带 service=ghcr.io 且 manifest GET 要带
      # OCI/idx Accept 头，否则 audience 错 token 会得到误导性 404。
      - name: Check package visibility
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -u
          check_pull() {
            FAILED=""
            for p in "${IMAGE_NAME}" "amd64-${IMAGE_NAME}" "aarch64-${IMAGE_NAME}"; do
              T=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY_OWNER}/$p:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' || true)
              C=$(curl -s -o /dev/null -w "%{http_code}" \
                   -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                   "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER}/$p/manifests/${VERSION:-latest}" \
                   -H "Authorization: Bearer ${T:-none}" || echo 000)
              if [ "$C" = "200" ]; then
                echo "✅ ${p} 匿名可拉（public）"
              else
                FAILED="${FAILED} ${p}(HTTP $C)"
              fi
            done
          }
          check_pull
          if [ -n "${FAILED}" ]; then
            # v1.6.9：复测一次再定罪——排除 ghcr 传播延迟/瞬时网络导致的误报
            echo "⏳ 首轮失败，15 秒后复测：${FAILED}"
            sleep 15
            check_pull
          fi
          if [ -n "${FAILED}" ]; then
            # v1.6.9（外部审计确认）：由 ::warning 升级为阻断——config.yaml 已启用
            # image: 路由，包不可匿名拉取时用户安装必失败，绿 CI 是掩盖故障
            echo "::error title=ghcr 包不可匿名拉取::${FAILED} —— image 路线安装会失败。修复：gh api -X DELETE /user/packages/container/<pkg> 删包后重推 CI 自动按仓库 public 重建（详见本文件上方注释）"
            exit 1
          fi


  # ========== 3. 创建 GitHub Release ==========
  release:
    name: Release
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
