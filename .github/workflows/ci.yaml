name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: huijian-mqtt-broker

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ========== 0. 代码质量检查 ==========
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          # 检查所有 shell 脚本语法是否正确
          apt-get update -qq && apt-get install -y -qq shellcheck > /dev/null 2>&1 || true
          for f in huijian_mqtt_broker/run.sh; do
            echo "检查 $f ..."
            bash -n "$f" || exit 1
            shellcheck "$f" || echo "⚠ shellcheck 警告（非阻塞）"
          done

      - name: Check YAML files syntax
        run: |
          pip install -q pyyaml
          python3 -c '
          import yaml, sys, glob
          for f in glob.glob("**/*.yaml", recursive=True):
              try:
                  yaml.safe_load(open(f))
                  print(f"✅ {f}")
              except Exception as e:
                  print(f"❌ {f}: {e}")
                  sys.exit(1)
          '

      - name: Check JSON files syntax
        run: |
          for f in $(find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*"); do
            python3 -c "import json; json.load(open('$f'))" || exit 1
            echo "✅ $f"
          done

      - name: Python syntax & unit tests (v1.6.3 回归护栏)
        run: |
          # 38 个既有单测 + 注册表实参回归测试曾在本地全绿却漏掉 v1.6.0 的
          # "entity" 字面量回归——CI 从未跑过 pytest，本地验证形同虚设。补齐。
          # 依赖说明：services.py 真实 import voluptuous（conftest 只假造
          # homeassistant 包树）；@pytest.mark.asyncio 需要 pytest-asyncio，
          # 缺失时 pytest 会把 async 测试直接判 error。
          pip install -q pytest pytest-asyncio voluptuous
          python3 -m py_compile huijian_mqtt_broker/custom_components/window_controller_gateway/*.py
          python3 -m py_compile huijian_mqtt_broker/mdns_publisher.py
          python3 -m pytest huijian_mqtt_broker/tests -q

      - name: Verify version consistency
        run: |
          VERSION=$(grep '^version:' huijian_mqtt_broker/config.yaml | head -1 | awk -F'"' '{print $2}')
          echo "config.yaml 版本: $VERSION"
          # 检查 index.html 版本一致
          HTML_VER=$(grep "CURRENT_VERSION = '" huijian_mqtt_broker/www/index.html | sed "s/.*CURRENT_VERSION = '\([^']*\)'.*/\1/")
          echo "index.html 版本: $HTML_VER"
          [ "$VERSION" = "$HTML_VER" ] || { echo "❌ 版本不一致"; exit 1; }
          # 检查 version.json 两个字段一致（addon_version 与 integration_version
          # 此前只查前者，manifest.json 完全没查——四处版本一致是 CLAUDE.md 铁律）
          python3 - "$VERSION" <<'PYEOF'
          import json, sys
          want = sys.argv[1]
          vj = json.load(open('huijian_mqtt_broker/www/version.json'))
          mf = json.load(open('huijian_mqtt_broker/custom_components/window_controller_gateway/manifest.json'))
          for label, got in [("version.json.addon_version", vj.get("addon_version")),
                             ("version.json.integration_version", vj.get("integration_version")),
                             ("manifest.json.version", mf.get("version"))]:
              status = "✅" if got == want else "❌"
              print(f"{status} {label}: {got}")
              if got != want:
                  sys.exit(1)
          PYEOF
          echo "✅ 所有版本号一致: $VERSION"

  # ========== 1. 读取版本号 & 准备变更日志 ==========
  prepare:
    name: Prepare
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' huijian_mqtt_broker/config.yaml | head -1 | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到版本号: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # 将 changelog 写入临时文件，避免 echo -e 破坏中文编码（Gitee 乱码根因）
          CHANGELOG_FILE="/tmp/changelog.md"
          
          if [ -f CHANGELOG.md ]; then
            awk -v ver="${{ steps.version.outputs.version }}" '
              /^## \[/{ found=0 }
              $0 ~ "^## \\["ver"]" { found=1; next }
              /^## \[/{ if(found) exit }
              found { print }
            ' CHANGELOG.md | head -50 > "$CHANGELOG_FILE"
          fi
          
          if [ ! -s "$CHANGELOG_FILE" ]; then
            # 从 git log 自动生成 changelog（最近 10 条提交）
            {
              echo "## v${{ steps.version.outputs.version }}"
              echo ""
              git log --oneline -10 --format='- %h: %s'
            } > "$CHANGELOG_FILE"
          fi
          
          # 用文件内容设置输出（避免 echo -e 破坏 UTF-8 中文）
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          cat "$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

  # ========== 2. 构建 Docker 镜像 ==========
  init:
    name: Init
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, init]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "huijian_mqtt_broker"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Manifest
    needs: [prepare, init, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest

      # v1.6.3：ghcr 包默认 private，匿名拉取 403——CI 推上去的镜像 Supervisor
      # 根本用不了（config.yaml 无法声明 image），构建纯属白烧 runner。
      # 用本次构建的 GITHUB_TOKEN（packages:write）把包设为 public；
      # 成功后即可在 config.yaml 启用 image: ghcr.io/fangwenyi-dev/{arch}-huijian-mqtt-broker。
      # 失败不阻塞发布（源码构建路径仍可用），但日志必须醒目提示。
      - name: Make container packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          FAILED=""
          for p in "${IMAGE_NAME}" "amd64-${IMAGE_NAME}" "aarch64-${IMAGE_NAME}"; do
            if curl -fsS -o /dev/null -X PATCH \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/users/${GITHUB_ACTOR}/packages/container/${p}/visibility" \
                 -d '{"visibility":"public"}'; then
              echo "✅ ${p} 已设为 public"
            else
              FAILED="${FAILED} ${p}"
            fi
          done
          if [ -n "${FAILED}" ]; then
            echo "::warning title=ghcr 包未能公开::以下包设为 public 失败:${FAILED}——config.yaml 的 image: 字段不可启用，用户仍走源码构建路径；可在仓库 Settings 手动公开"
          fi

  # ========== 3. 创建 GitHub Release ==========
  release:
    name: Release
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
