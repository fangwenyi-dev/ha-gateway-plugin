name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: huijian-mqtt-broker

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ========== 0. 代码质量检查 ==========
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          # 检查所有 shell 脚本语法是否正确
          apt-get update -qq && apt-get install -y -qq shellcheck > /dev/null 2>&1 || true
          for f in huijian_mqtt_broker/run.sh huijian_mqtt_broker/auto_setup_mqtt.sh; do
            echo "检查 $f ..."
            bash -n "$f" || exit 1
            shellcheck "$f" || echo "⚠ shellcheck 警告（非阻塞）"
          done

      - name: Check YAML files syntax
        run: |
          pip install -q pyyaml
          python3 -c '
          import yaml, sys, glob
          for f in glob.glob("**/*.yaml", recursive=True):
              try:
                  yaml.safe_load(open(f))
                  print(f"✅ {f}")
              except Exception as e:
                  print(f"❌ {f}: {e}")
                  sys.exit(1)
          '

      - name: Check JSON files syntax
        run: |
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            python3 -c "import json; json.load(open('$f'))" || exit 1
            echo "✅ $f"
          done

      - name: Verify version consistency
        run: |
          VERSION=$(grep '^version:' huijian_mqtt_broker/config.yaml | head -1 | awk -F'"' '{print $2}')
          echo "config.yaml 版本: $VERSION"
          # 检查 index.html 版本一致
          HTML_VER=$(grep -oP "CURRENT_VERSION = '\K[^']+" huijian_mqtt_broker/www/index.html)
          echo "index.html 版本: $HTML_VER"
          [ "$VERSION" = "$HTML_VER" ] || { echo "❌ 版本不一致"; exit 1; }
          # 检查 version.json 版本一致
          JSON_VER=$(python3 -c "import json; print(json.load(open('huijian_mqtt_broker/www/version.json'))['addon_version'])")
          echo "version.json 版本: $JSON_VER"
          [ "$VERSION" = "$JSON_VER" ] || { echo "❌ 版本不一致"; exit 1; }
          echo "✅ 所有版本号一致: $VERSION"

  # ========== 1. 读取版本号 & 准备变更日志 ==========
  prepare:
    name: Prepare
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' huijian_mqtt_broker/config.yaml | head -1 | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到版本号: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk -v ver="${{ steps.version.outputs.version }}" '
              /^## \[/{ found=0 }
              $0 ~ "^## \\["ver"]" { found=1; next }
              /^## \[/{ if(found) exit }
              found { print }
            ' CHANGELOG.md | head -50)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="## v${{ steps.version.outputs.version }}

          - 修复 Mosquitto 启动崩溃问题
          - Web UI 新增网关配对、子设备控制、状态显示
          - Web UI 新增版本检查/更新功能"
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

  # ========== 2. 构建 Docker 镜像 ==========
  init:
    name: Init
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, init]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "huijian_mqtt_broker"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Manifest
    needs: [prepare, init, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest

  # ========== 3. 创建 GitHub Release ==========
  release:
    name: Release
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
