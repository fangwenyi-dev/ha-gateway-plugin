# =============================================================================
# 慧尖 MQTT Broker — Mosquitto 配置文件
#
# 容器内固定监听 2022，不使用 1883 避免与 HA 官方 Mosquitto 冲突
#
# MQTT 主题协议（与 ha-window-controller-gateway 集成 const.py 完全一致）：
#
#   主题                        方向          发布者        订阅者
#   ─────────────────────────  ──────────   ──────────   ──────────
#   gateway/{gateway_sn}/req   HA → 网关     HA MQTT集成   LoRa 网关
#   gateway/rpt_rsp            网关 → HA     LoRa 网关     HA MQTT集成
#
# 协议格式（$SH 协议头）：
#   {"head":"$SH","ctype":"00X","id":<id>,"sn":"<网关SN>","data":{...}}
#
# ctype 定义：
#   001: 网关绑定（网关主动发起，HA 回复 errcode:0 + uuid）
#   002: 网关状态上报（网关主动发起，HA 回复 errcode:0 确认）
#   003: 配对/解绑子设备（HA 主动发起，网关回复 errcode）
#   004: 设备控制（HA 主动发起，网关回复 errcode）
#   005: 设备状态上报（网关主动发起，HA 回复 errcode:0 确认）
#   006: 设置参数（HA 主动发起）
#   007: 查询参数（HA 主动发起）
# =============================================================================

# ---------- TCP 监听（容器内固定 2022） ----------
listener 2022 0.0.0.0
protocol mqtt

# ---------- 认证 ----------
allow_anonymous false
password_file /etc/mosquitto/passwd

# ---------- ACL 访问控制 ----------
acl_file /etc/mosquitto/acl

# ---------- 持久化 ----------
persistence true
persistence_location /data/mosquitto/
autosave_interval 1800

# ---------- 日志 ----------
# v1.6.3：log_type all 会把每个连接的订阅/发布主题（含全部网关 SN）、
# 客户端 IP、消息 QoS 轨迹全量写入 Supervisor 日志（宿主可读）。
# 日常运维只需 warning/error（认证失败、ACL 拒绝、socket 错误都在此两级）；
# 排障需要全量时临时改回 all 并重启插件。
log_dest stdout
log_type warning
log_type error
connection_messages false
log_timestamp_format %Y-%m-%d %H:%M:%S

# ---------- 协议参数 ----------
max_keepalive 600
max_inflight_messages 20
max_queued_messages 100
max_connections -1
