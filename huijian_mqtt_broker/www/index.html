<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030712">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E">
    <title>慧尖 LoRa 网关</title>
    <link rel="stylesheet" href="css/huijian.css?v=1.7.4">
</head>
<body>
    <!-- v1.6.27「星辰大海」背景层（对齐小程序 UI 标准 0d2200c5）：
         z0 固定星空（氛围底/星云一朵/星点/行星群由 css + starsky.js 生成，
         流星 7 颗标记式——行程 1100px 全周期只准向下）；内容层 z1 悬浮玻璃。
         aria-hidden：纯装饰，不进辅助技术。 -->
    <div class="star-bg" aria-hidden="true">
        <div class="nebula"></div>
    <div class="nebula3"></div>
        <div class="stars-far" id="starsFar"></div>
        <div class="stars-near" id="starsNear"></div>
        <div class="stars-cluster" id="clusters"></div>
        <div class="planets" id="planets"></div>
        <span class="meteor meteor-1"></span><span class="meteor meteor-2 m-blue"></span><span class="meteor meteor-3"></span><span class="meteor meteor-4 m-amber"></span><span class="meteor meteor-5 m-blue"></span><span class="meteor meteor-6"></span><span class="meteor meteor-7"></span>
    </div>
    <div class="page">
    <div class="header">
        <div class="brand">
            <span class="brand-logo"><img src="img/logo.png" alt="慧尖 logo"></span>
            <div class="brand-text">
                <h1>慧尖 LoRa 网关</h1>
                <span class="ver" id="addonVersion"></span>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-primary" id="checkUpdateBtn" onclick="checkForUpdates()">检查更新</button>
            <button class="btn btn-primary" onclick="refreshAll()">⟳ 刷新</button>
        </div>
    </div>

    <div class="card card-flush card-dense">
        <div class="card-title">服务状态</div>
        <div class="status-grid" id="statusGrid">
            <div class="status-item">
                <span class="dot dot-warn"></span>
                <span class="label">MQTT Broker</span>
                <span class="value" id="mqttStatus">检测中</span>
            </div>
            <div class="status-item">
                <span class="dot dot-warn"></span>
                <span class="label">网关集成</span>
                <span class="value" id="integrationStatus">检测中</span>
            </div>
            <div class="status-item">
                <span class="dot dot-warn"></span>
                <span class="label">HA MQTT</span>
                <span class="value" id="haMqttStatus">检测中</span>
            </div>
        </div>
    </div>

    <div class="card card-flush">
        <div class="card-title">网关与子设备</div>
        <div id="gatewayContainer">
            <div class="loading"><div class="spinner"></div><p>正在加载网关信息...</p></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">连接信息</div>
        <div class="conn-grid">
            <div class="conn-item">
                <div class="conn-label">MQTT 地址</div>
                <div class="conn-value">huijian.local:2022</div>
            </div>
            <div class="conn-item">
                <div class="conn-label">MQTT 凭据</div>
                <div class="conn-value dim">请在 插件 → 配置 标签页中查看/修改</div>
            </div>
        </div>
        <div class="info-box">
            <h3>LoRa 网关配置说明</h3>
            <p>
                Broker: <code>huijian.local</code>（mDNS）或 HA 的 IP 地址<br>
                端口: <code>2022</code> — MQTT 凭据请在插件「配置」标签页中查看/修改<br>
                网关上电后自动发现，无需手动填写 SN
            </p>
        </div>
    </div>

    <div class="card" id="updateCard" style="display:none;">
        <div class="card-title">版本更新</div>
        <div id="updateContent"></div>
    </div>

    <div class="footer">
        <!-- v1.6.26（W-6）：留空占位——旧硬编码 v1.5.1 在 JS 回填前闪现错版
             （JS 挂掉时更会永久错版）。版本单一真源＝下行 CURRENT_VERSION。 -->
        <p>慧尖 LoRa 网关一体化插件 <span id="footerVersion"></span></p>
    </div>
    </div><!-- /.page -->

    <!-- v1.6.25 Web UI 三文件化：css/js 外置（相对路径，兼容 HA ingress 前缀）。
         CURRENT_VERSION 按测试锚留在本文件；huijian.js 复用此全局 let 绑定。
         v1.6.27 新增 starsky.js：纯装饰星野生成器（固定种子，零依赖零网络）。 -->
    <script>let CURRENT_VERSION = '1.7.4';</script>
    <script src="js/starsky.js?v=1.7.4"></script>
    <script src="js/huijian.js?v=1.7.4"></script>
</body>
</html>
