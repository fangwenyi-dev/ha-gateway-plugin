<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慧尖 LoRa 网关</title>
    <style>
        :root {
            --primary: #5b6ee1;
            --primary-dark: #4451b5;
            --primary-light: #818cf8;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --green: #10b981;
            --green-bg: #ecfdf5;
            --red: #ef4444;
            --red-bg: #fef2f2;
            --yellow: #f59e0b;
            --yellow-bg: #fffbeb;
            --blue: #3b82f6;
            --blue-bg: #eff6ff;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg); color: var(--text); padding: 12px; max-width: 860px; margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }
        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; padding: 20px 24px; border-radius: var(--radius); margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow-md);
        }
        .header h1 { font-size: 20px; font-weight: 700; }
        .header .ver { font-size: 11px; opacity: 0.75; margin-top: 2px; }
        .header .actions { display: flex; gap: 6px; }
        .btn {
            padding: 7px 16px; border-radius: 8px; border: none; font-size: 13px;
            cursor: pointer; font-weight: 600; transition: all .15s; display: inline-flex;
            align-items: center; gap: 4px;
        }
        .btn-primary { background: white; color: var(--primary); }
        .btn-primary:hover { background: #f0f0ff; }
        .btn-success { background: var(--green); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warn { background: var(--yellow); color: white; }
        .btn-warn:hover { background: #d97706; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        /* ===== Card ===== */
        .card {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px 18px;
            box-shadow: var(--shadow); margin-bottom: 12px;
        }
        .card-title {
            font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 14px;
            display: flex; align-items: center; gap: 6px;
        }
        /* ===== Status Grid ===== */
        .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .status-item {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 14px 8px; border-radius: 10px; background: var(--bg); transition: all .2s;
        }
        .status-item .dot { width: 10px; height: 10px; border-radius: 50%; margin-bottom: 8px; }
        .dot-ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
        .dot-err { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
        .dot-warn { background: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-bg); }
        .status-item .label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
        .status-item .value { font-size: 13px; font-weight: 700; }
        /* ===== Gateway ===== */
        .gateway-item {
            border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px;
            transition: border-color .2s;
        }
        .gateway-item:hover { border-color: var(--primary-light); }
        .gateway-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .gateway-name { font-size: 15px; font-weight: 700; }
        .gateway-sn { font-size: 11px; color: var(--text-muted); margin-left: 8px; }
        .device-list { margin-top: 8px; }
        .device-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; border-radius: 8px; background: var(--bg);
            margin-bottom: 6px; flex-wrap: wrap; gap: 8px; transition: background .15s;
        }
        .device-item:hover { background: #eef0f4; }
        .device-info { flex: 1; min-width: 100px; }
        .device-name { font-size: 13px; font-weight: 600; }
        .device-sn { font-size: 10px; color: var(--text-muted); }
        .device-status { font-size: 11px; margin-top: 3px; color: var(--text-muted); }
        .device-controls { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
        .position-slider { width: 90px; height: 22px; }
        /* ===== Device online dot ===== */
        .dev-name { display: flex; align-items: center; gap: 6px; }
        .dev-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .dot-online { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
        .dot-offline { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
        /* ===== Device sliders ===== */
        .slider-label { font-size: 10px; color: var(--text-muted); }
        .slider-value { font-size: 11px; min-width: 30px; text-align: right; }
        .speed-slider, .strength-slider { width: 90px; height: 22px; }
        /* ===== Badge ===== */
        .badge {
            display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 600;
        }
        .badge-ok { background: var(--green-bg); color: #065f46; }
        .badge-warn { background: var(--yellow-bg); color: #92400e; }
        .badge-err { background: var(--red-bg); color: #991b1b; }
        .badge-info { background: var(--blue-bg); color: #1e40af; }
        .badge-gray { background: #f3f4f6; color: #6b7280; }
        /* ===== Update ===== */
        .update-box {
            background: linear-gradient(135deg, var(--blue-bg) 0%, #dbeafe 100%);
            border-radius: 10px; padding: 16px; margin-top: 10px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
        }
        .update-info { flex: 1; min-width: 200px; }
        .update-title { font-size: 14px; font-weight: 700; color: var(--blue); }
        .update-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        /* ===== Misc ===== */
        .loading { text-align: center; padding: 20px; color: var(--text-muted); }
        .spinner {
            display: inline-block; width: 24px; height: 24px;
            border: 3px solid var(--border); border-top: 3px solid var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
            border-radius: 10px; color: white; font-size: 13px; z-index: 9999;
            animation: slideIn .3s ease; max-width: 360px; box-shadow: var(--shadow-md);
        }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-ok { background: var(--green); }
        .toast-err { background: var(--red); }
        .toast-warn { background: var(--yellow); }
        .info-box { background: var(--blue-bg); border-left: 4px solid var(--blue); padding: 12px; border-radius: 8px; margin-top: 10px; }
        .info-box h3 { font-size: 12px; color: var(--blue); margin-bottom: 6px; font-weight: 700; }
        .info-box p { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
        .info-box code {
            background: white; padding: 2px 6px; border-radius: 4px;
            font-family: "SF Mono", Consolas, monospace; font-size: 11px; color: var(--text);
        }
        .footer { text-align: center; padding: 16px; color: #b0b0b0; font-size: 11px; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); }
        .empty-state .icon { font-size: 36px; margin-bottom: 8px; }
        .empty-state .hint { font-size: 12px; margin-top: 8px; }
        @media (max-width: 520px) {
            .status-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>慧尖 LoRa 网关</h1>
            <div class="ver" id="addonVersion">v1.3.0</div>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="checkForUpdates()">检查更新</button>
            <button class="btn btn-primary" onclick="refreshAll()">刷新</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">服务状态</div>
        <div class="status-grid" id="statusGrid">
            <div class="status-item">
                <div class="dot dot-warn"></div>
                <span class="label">MQTT Broker</span>
                <span class="value" id="mqttStatus">检测中</span>
            </div>
            <div class="status-item">
                <div class="dot dot-warn"></div>
                <span class="label">网关集成</span>
                <span class="value" id="integrationStatus">检测中</span>
            </div>
            <div class="status-item">
                <div class="dot dot-warn"></div>
                <span class="label">HA MQTT</span>
                <span class="value" id="haMqttStatus">检测中</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">网关与子设备</div>
        <div id="gatewayContainer">
            <div class="loading"><div class="spinner"></div><p>正在加载网关信息...</p></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">连接信息</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
            <div>
                <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">MQTT 地址</div>
                <strong style="font-size:13px;">huijian.local:2022</strong>
            </div>
            <div>
                <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">MQTT 凭据</div>
                <strong style="font-size:13px;">请在 插件 → 配置 标签页中查看/修改</strong>
            </div>
        </div>
        <div class="info-box">
            <h3>LoRa 网关配置说明</h3>
            <p>
                Broker: <code>huijian.local</code>（mDNS）或 HA 的 IP 地址<br>
                端口: <code>2022</code> — MQTT 凭据请在插件「配置」标签页中查看/修改<br>
                网关上电后自动发现，无需手动填写 SN
            </p>
        </div>
    </div>

    <div class="card" id="updateCard" style="display:none;">
        <div class="card-title">版本更新</div>
        <div id="updateContent"></div>
    </div>

    <div class="footer">
        <p>慧尖 LoRa 网关一体化插件 <span id="footerVersion">v1.3.0</span></p>
    </div>

    <script>
        let CURRENT_VERSION = '1.3.0';
        const DOMAIN = 'window_controller_gateway';

        // Ingress 下页面路径形如 /hassio/ingress/<token>/，直连插件端口时为 /
        const INGRESS_BASE = window.location.pathname.replace(/\/[^/]*$/, '/');
        // 各配置条目的网关 SN（控制操作后刷新设备用，避免空 SN 误匹配首个实体）
        const GATEWAY_SN_BY_ENTRY = {};

        // ========== 初始化 ==========
        async function init() {
            try {
                const verResp = await fetch(INGRESS_BASE + 'api/version');
                if (verResp.ok) {
                    const verData = await verResp.json();
                    CURRENT_VERSION = verData.addon_version || CURRENT_VERSION;
                    document.getElementById('addonVersion').textContent = 'v' + CURRENT_VERSION;
                    document.getElementById('footerVersion').textContent = 'v' + CURRENT_VERSION;
                }
            } catch (e) { console.log('版本获取失败:', e); }
            await refreshAll();
        }

        // ========== 刷新所有 ==========
        async function refreshAll() {
            await checkServiceStatus();
            await loadGateways();
        }

        // ========== 检查服务状态 ==========
        async function checkServiceStatus() {
            // 1. MQTT Broker 状态 — nginx 直接返回，不依赖 HA API
            try {
                const resp = await fetch(INGRESS_BASE + 'api/status');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.status === 'running') {
                        setStatusDot('mqttStatus', 'ok', '运行中');
                    } else {
                        setStatusDot('mqttStatus', 'err', '已停止');
                    }
                } else {
                    setStatusDot('mqttStatus', 'err', 'HTTP ' + resp.status);
                }
            } catch (e) {
                setStatusDot('mqttStatus', 'err', '无法连接');
            }
            // 2. 网关集成检测 — 插件本地事实（run.sh 安装集成后写入 integration.json），
            //    不经 /api/ha/ 代理调 HA Core API（Core 会拒绝插件 token，报 401）
            try {
                const resp = await fetch(INGRESS_BASE + 'api/integration');
                if (!resp.ok) {
                    setStatusDot('integrationStatus', 'err', 'HTTP ' + resp.status);
                } else {
                    const info = await resp.json();
                    setStatusDot('integrationStatus', info.installed ? 'ok' : 'warn',
                        info.installed ? '已安装 v' + (info.version || '?') : '未安装');
                }
            } catch (e) {
                setStatusDot('integrationStatus', 'err', '无法读取');
            }
            // 3. HA MQTT 连接检测 — broker 实际连接数（broker_status.json 由后台循环刷新）
            try {
                const resp = await fetch(INGRESS_BASE + 'api/broker');
                if (!resp.ok) {
                    setStatusDot('haMqttStatus', 'err', 'HTTP ' + resp.status);
                } else {
                    const info = await resp.json();
                    setStatusDot('haMqttStatus', info.clients > 0 ? 'ok' : 'warn',
                        info.clients > 0 ? '已连接 (' + info.clients + ')' : '未连接');
                }
            } catch (e) {
                setStatusDot('haMqttStatus', 'err', '无法读取');
            }
        }

        function setStatusDot(elementId, status, text) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.parentElement.querySelector('.dot').className = 'dot dot-' + status;
        }

        // ========== HA API 调用 ==========
        async function haApi(path, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            return await fetch(INGRESS_BASE + 'api/ha/' + path.replace(/^\//, ''), opts);
        }

        // ========== 加载网关列表 ==========
        async function loadGateways() {
            const container = document.getElementById('gatewayContainer');
            try {
                const resp = await haApi('/config/config_entries/entry?domain=' + DOMAIN);
                if (!resp.ok) throw new Error('HA API ' + resp.status);
                const entries = await resp.json();
                if (!entries || entries.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">📡</div><p>暂无网关</p><p class="hint">LoRa 网关上电后自动发现，或手动添加集成</p></div>';
                    return;
                }
                let html = '';
                for (const entry of entries) {
                    const gwSn = (entry.data && entry.data.gateway_sn) || '未知';
                    const gwName = entry.title || '慧尖网关';
                    html += renderGateway(gwName, gwSn, entry.entry_id);
                }
                container.innerHTML = html;
                for (const entry of entries) {
                    GATEWAY_SN_BY_ENTRY[entry.entry_id] = (entry.data && entry.data.gateway_sn) || '';
                    await loadGatewayDevices(entry.entry_id, GATEWAY_SN_BY_ENTRY[entry.entry_id]);
                }
            } catch (e) {
                if (String(e).includes('HA API 401')) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>面板无权直接读取网关列表</p><p class="hint">请在 HA → 设置 → 设备与服务 → 「慧尖」集成中管理网关</p></div>';
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="icon">📡</div><p>无法连接 HA API</p><p class="hint">请确保通过 HA 侧边栏访问</p></div>';
                }
                container.innerHTML += '<div class="info-box"><h3>使用说明</h3><p>1. 重启 HA → 添加「慧尖」集成<br>2. 在网关设备上点击「配对」按钮添加子设备<br>3. 在 HA 设备页面控制子设备</p></div>';
            }
        }

        function renderGateway(name, sn, entryId) {
            const safeName = escapeHtml(name);
            const safeSn = escapeHtml(sn);
            const safeEntryId = escapeHtml(entryId);
            return '<div class="gateway-item" id="gw-' + safeEntryId + '">' +
                '<div class="gateway-header"><div>' +
                '<span class="gateway-name">' + safeName + '</span>' +
                '<span class="gateway-sn">SN: ' + safeSn + '</span>' +
                '</div><div>' +
                '<span class="badge badge-info" id="gw-status-' + safeEntryId + '">检测中</span>' +
                '<button class="btn btn-success btn-sm" onclick="startPairing(\'' + jsQuote(safeEntryId) + '\',\'' + jsQuote(safeSn) + '\')" style="margin-left:8px;">配对</button>' +
                '<button class="btn btn-sm" style="background:#78909c;color:white;margin-left:4px;" onclick="checkGatewayStatus(\'' + jsQuote(safeEntryId) + '\',\'' + jsQuote(safeSn) + '\')" title="检查网关连接状态">状态</button>' +
                '</div></div>' +
                '<div class="device-list" id="devices-' + safeEntryId + '"><div class="loading"><div class="spinner" style="width:16px;height:16px;"></div></div></div>' +
                '</div>';
        }

        async function loadGatewayDevices(entryId, gatewaySn) {
            const deviceListEl = document.getElementById('devices-' + entryId);
            const statusEl = document.getElementById('gw-status-' + entryId);
            if (!deviceListEl) return;
            try {
                const resp = await haApi('/window_controller_gateway/devices?config_entry_id=' + entryId);
                if (!resp.ok) throw new Error('HA API ' + resp.status);
                const devices = await resp.json();
                if (!devices || devices.length === 0) {
                    deviceListEl.innerHTML = '<p style="font-size:12px;color:var(--text-muted);padding:8px;">暂无子设备，点击「配对」按钮添加</p>';
                    updateGatewayStatus(statusEl, 'offline');
                    return;
                }
                let subDevices = [];
                for (const dev of devices) {
                    if (dev.via_device_id) subDevices.push(dev);
                }
                try {
                    const stateResp = await haApi('/states');
                    if (!stateResp.ok) throw new Error('HA API ' + stateResp.status);
                    const states = await stateResp.json();
                    const snSuffix = (gatewaySn && gatewaySn.length >= 4) ? gatewaySn.slice(-6).toLowerCase() : '';
                    const gwSensor = snSuffix ? states.find(s =>
                        s.entity_id.includes('binary_sensor') &&
                        s.entity_id.toLowerCase().includes(snSuffix) &&
                        s.entity_id.includes('online')
                    ) : null;
                    updateGatewayStatus(statusEl, gwSensor ? (gwSensor.state === 'on' ? 'online' : 'offline') : 'unknown');
                    if (subDevices.length === 0) {
                        deviceListEl.innerHTML = '<p style="font-size:12px;color:var(--text-muted);padding:8px;">暂无子设备，点击「配对」按钮添加</p>';
                        return;
                    }
                    let html = '';
                    for (const dev of subDevices) html += renderDevice(dev, entryId, states);
                    deviceListEl.innerHTML = html;
                    for (const dev of subDevices) loadDeviceState(dev, states);
                } catch (e) {
                    updateGatewayStatus(statusEl, 'unknown');
                    if (subDevices.length === 0) {
                        deviceListEl.innerHTML = '<p style="font-size:12px;color:var(--text-muted);padding:8px;">暂无子设备，点击「配对」按钮添加</p>';
                        return;
                    }
                    let html = '';
                    for (const dev of subDevices) html += renderDevice(dev, entryId, []);
                    deviceListEl.innerHTML = html;
                }
            } catch (e) {
                deviceListEl.innerHTML = '<p style="font-size:12px;color:var(--red);">加载设备失败: ' + escapeHtml(e.message) + '</p>';
            }
        }

        function updateGatewayStatus(el, status) {
            if (status === 'online') { el.className = 'badge badge-ok'; el.textContent = '在线'; }
            else if (status === 'pairing') { el.className = 'badge badge-warn'; el.textContent = '配对中'; }
            else if (status === 'offline') { el.className = 'badge badge-err'; el.textContent = '离线'; }
            else { el.className = 'badge badge-gray'; el.textContent = '未知'; }
        }

        function renderDevice(dev, entryId, states) {
            const devName = dev.name_by_user || dev.name || '未命名设备';
            const devId = dev.id;
            let sn = '未知';
            if (dev.identifiers && dev.identifiers.length > 0) {
                const ident = dev.identifiers[0];
                if (Array.isArray(ident) && ident.length > 1) sn = ident[1];
            }
            const supportsWindLock = sn.startsWith('5005');
            const snSuffix = (sn !== '未知' && sn.length >= 4) ? sn.slice(-6).toLowerCase() : '';
            const coverEntity = snSuffix ? states.find(s =>
                s.entity_id.startsWith('cover.') && s.entity_id.toLowerCase().includes(snSuffix)
            ) : null;
            // 在线状态: binary_sensor.*{sn_suffix}*online*
            const onlineEntity = snSuffix ? states.find(s =>
                s.entity_id.startsWith('binary_sensor.') &&
                s.entity_id.toLowerCase().includes(snSuffix) &&
                s.entity_id.includes('online')
            ) : null;
            // 电池电压: sensor.*{sn_suffix}*voltage* 或 sensor.*{sn_suffix}*battery*
            const batteryEntity = snSuffix ? states.find(s =>
                s.entity_id.startsWith('sensor.') && s.entity_id.toLowerCase().includes(snSuffix) &&
                (s.entity_id.includes('voltage') || s.entity_id.includes('battery'))
            ) : null;
            // 开窗速度/力度: number.*{sn_suffix}*speed* / number.*{sn_suffix}*strength*
            const speedEntity = snSuffix ? states.find(s =>
                s.entity_id.startsWith('number.') && s.entity_id.toLowerCase().includes(snSuffix) && s.entity_id.includes('speed')
            ) : null;
            const strengthEntity = snSuffix ? states.find(s =>
                s.entity_id.startsWith('number.') && s.entity_id.toLowerCase().includes(snSuffix) && s.entity_id.includes('strength')
            ) : null;
            // 集成未提供 current_position，实际位置属性为 attributes.position（缺失时显示 --）
            const rawPos = coverEntity ? coverEntity.attributes.position : undefined;
            const currentPos = (rawPos === undefined || rawPos === null) ? '--' : rawPos;
            const safeName = escapeHtml(devName);
            const safeSn = escapeHtml(sn);
            const safeDevId = escapeHtml(devId);
            const safeEntryId = escapeHtml(entryId);
            // 在线圆点（无实体时默认离线红点，loadDeviceState 会再校正）
            const isOnline = onlineEntity ? (onlineEntity.state === 'on') : false;
            // 电池电压（sensor 优先，缺失时回退 cover attributes.voltage）
            let batteryText = '';
            if (batteryEntity && batteryEntity.state && batteryEntity.state !== 'unknown' && batteryEntity.state !== 'unavailable') {
                const bUnit = batteryEntity.attributes.unit_of_measurement || 'V';
                batteryText = batteryEntity.state + bUnit;
            } else if (coverEntity && coverEntity.attributes.voltage) {
                batteryText = coverEntity.attributes.voltage + 'V';
            }
            // 速度/力度滑块取值与范围（缺失实体时禁用）
            const speedMin = speedEntity && speedEntity.attributes.min !== undefined ? speedEntity.attributes.min : 0;
            const speedMax = speedEntity && speedEntity.attributes.max !== undefined ? speedEntity.attributes.max : 100;
            const speedValid = speedEntity && speedEntity.state && speedEntity.state !== 'unknown' && speedEntity.state !== 'unavailable';
            const speedUnit = (speedEntity && speedEntity.attributes.unit_of_measurement) || '';
            const strengthMin = strengthEntity && strengthEntity.attributes.min !== undefined ? strengthEntity.attributes.min : 0;
            const strengthMax = strengthEntity && strengthEntity.attributes.max !== undefined ? strengthEntity.attributes.max : 100;
            const strengthValid = strengthEntity && strengthEntity.state && strengthEntity.state !== 'unknown' && strengthEntity.state !== 'unavailable';
            const strengthUnit = (strengthEntity && strengthEntity.attributes.unit_of_measurement) || '';
            let controls = '<div class="device-controls">' +
                '<button class="btn btn-success btn-sm" onclick="controlDevice(\'' + jsQuote(safeDevId) + '\',\'open\',\'' + jsQuote(safeEntryId) + '\')">开</button>' +
                '<button class="btn btn-danger btn-sm" onclick="controlDevice(\'' + jsQuote(safeDevId) + '\',\'close\',\'' + jsQuote(safeEntryId) + '\')">关</button>' +
                '<button class="btn btn-warn btn-sm" onclick="controlDevice(\'' + jsQuote(safeDevId) + '\',\'stop\',\'' + jsQuote(safeEntryId) + '\')">停</button>' +
                '<input type="range" class="position-slider" min="0" max="100" value="' + (currentPos === '--' ? 0 : currentPos) + '"' +
                ' oninput="this.nextElementSibling.textContent=this.value+\'%\'"' +
                ' onchange="controlDevicePosition(\'' + jsQuote(safeDevId) + '\', this.value, \'' + jsQuote(safeEntryId) + '\')">' +
                '<span style="font-size:11px;min-width:30px;">' + currentPos + (currentPos === '--' ? '' : '%') + '</span>' +
                '<button class="btn btn-danger btn-sm" style="margin-left:4px;" title="移除设备" onclick="controlDevice(\'' + jsQuote(safeDevId) + '\',\'remove\',\'' + jsQuote(safeEntryId) + '\')">移除</button></div>';
            // 速度 / 力度滑块
            controls += '<div class="device-controls" style="margin-top:4px;">' +
                '<span class="slider-label">速度</span>' +
                '<input type="range" class="speed-slider" min="' + speedMin + '" max="' + speedMax + '" value="' + (speedValid ? speedEntity.state : speedMin) + '"' +
                (speedEntity ? '' : ' disabled') +
                ' oninput="this.nextElementSibling.textContent=this.value' + (speedUnit ? '+\'' + speedUnit + '\'' : '') + '"' +
                ' onchange="controlDevice(\'' + jsQuote(safeDevId) + '\',\'set_speed\',\'' + jsQuote(safeEntryId) + '\', this.value)">' +
                '<span class="slider-value speed-value">' + (speedValid ? speedEntity.state + speedUnit : '--') + '</span>' +
                '<span class="slider-label" style="margin-left:8px;">力度</span>' +
                '<input type="range" class="strength-slider" min="' + strengthMin + '" max="' + strengthMax + '" value="' + (strengthValid ? strengthEntity.state : strengthMin) + '"' +
                (strengthEntity ? '' : ' disabled') +
                ' oninput="this.nextElementSibling.textContent=this.value' + (strengthUnit ? '+\'' + strengthUnit + '\'' : '') + '"' +
                ' onchange="controlDevice(\'' + jsQuote(safeDevId) + '\',\'set_strength\',\'' + jsQuote(safeEntryId) + '\', this.value)">' +
                '<span class="slider-value strength-value">' + (strengthValid ? strengthEntity.state + strengthUnit : '--') + '</span></div>';
            if (supportsWindLock) {
                controls += '<div class="device-controls" style="margin-top:4px;">' +
                    '<button class="btn btn-sm" style="background:#607d8b;color:white;" onclick="controlDevice(\'' + jsQuote(safeDevId) + '\',\'a\',\'' + jsQuote(safeEntryId) + '\')">内倒</button>' +
                    '<button class="btn btn-sm" style="background:#455a64;color:white;margin-left:4px;" onclick="controlDevice(\'' + jsQuote(safeDevId) + '\',\'wind_lock_tilt\',\'' + jsQuote(safeEntryId) + '\')">内倒模式</button>' +
                    '<button class="btn btn-sm" style="background:#546e7a;color:white;margin-left:4px;" onclick="controlDevice(\'' + jsQuote(safeDevId) + '\',\'wind_lock_flat\',\'' + jsQuote(safeEntryId) + '\')">平开模式</button>' +
                    '</div>';
            }
            // 重命名按钮
            controls += '<div class="device-controls" style="margin-top:4px;">' +
                '<button class="btn btn-sm" style="background:#5c6bc0;color:white;" onclick="renameDevice(\'' + jsQuote(safeDevId) + '\',\'' + jsQuote(safeEntryId) + '\',\'' + jsQuote(safeName) + '\')" title="重命名设备">重命名</button>' +
                '</div>';
            return '<div class="device-item" id="dev-' + safeDevId + '">' +
                '<div class="device-info"><div class="device-name dev-name">' +
                '<span class="dev-dot ' + (isOnline ? 'dot-online' : 'dot-offline') + '" id="dev-dot-' + safeDevId + '"></span>' +
                safeName + '</div>' +
                '<div class="device-sn">SN: ' + safeSn + '</div>' +
                '<div class="device-status" id="dev-state-' + safeDevId + '">状态: 加载中' + (batteryText ? ' | 电压: ' + batteryText : '') + '</div></div>' +
                controls + '</div>';
        }

        function loadDeviceState(dev, states) {
            const stateEl = document.getElementById('dev-state-' + dev.id);
            if (!stateEl) return;
            try {
                let sn = '';
                if (dev.identifiers && dev.identifiers.length > 0) {
                    const ident = dev.identifiers[0];
                    if (Array.isArray(ident) && ident.length > 1) sn = ident[1];
                }
                const snSuffix = (sn && sn.length >= 4) ? sn.slice(-6).toLowerCase() : '';
                const coverEntity = snSuffix ? states.find(s =>
                    s.entity_id.startsWith('cover.') && s.entity_id.toLowerCase().includes(snSuffix)
                ) : null;
                // 在线状态点: binary_sensor.*{sn_suffix}*online*
                const onlineEntity = snSuffix ? states.find(s =>
                    s.entity_id.startsWith('binary_sensor.') &&
                    s.entity_id.toLowerCase().includes(snSuffix) &&
                    s.entity_id.includes('online')
                ) : null;
                const dot = document.querySelector('#dev-' + dev.id + ' .dev-dot');
                if (dot) {
                    if (onlineEntity) {
                        dot.className = 'dev-dot ' + (onlineEntity.state === 'on' ? 'dot-online' : 'dot-offline');
                    } else if (coverEntity) {
                        dot.className = 'dev-dot ' + (coverEntity.state === 'unavailable' ? 'dot-offline' : 'dot-online');
                    }
                }
                // 电池电压: sensor.*{sn_suffix}*voltage* 或 *battery*
                const batteryEntity = snSuffix ? states.find(s =>
                    s.entity_id.startsWith('sensor.') && s.entity_id.toLowerCase().includes(snSuffix) &&
                    (s.entity_id.includes('voltage') || s.entity_id.includes('battery'))
                ) : null;
                // 速度/力度: number.*{sn_suffix}*speed* / *strength*
                const speedEntity = snSuffix ? states.find(s =>
                    s.entity_id.startsWith('number.') && s.entity_id.toLowerCase().includes(snSuffix) && s.entity_id.includes('speed')
                ) : null;
                const strengthEntity = snSuffix ? states.find(s =>
                    s.entity_id.startsWith('number.') && s.entity_id.toLowerCase().includes(snSuffix) && s.entity_id.includes('strength')
                ) : null;
                // 更新速度/力度滑块
                const speedSlider = document.querySelector('#dev-' + dev.id + ' .speed-slider');
                if (speedSlider) {
                    if (speedEntity && speedEntity.state !== 'unknown' && speedEntity.state !== 'unavailable') {
                        const unit = speedEntity.attributes.unit_of_measurement || '';
                        speedSlider.value = speedEntity.state;
                        speedSlider.disabled = false;
                        const valEl = document.querySelector('#dev-' + dev.id + ' .speed-value');
                        if (valEl) valEl.textContent = speedEntity.state + unit;
                    } else {
                        speedSlider.disabled = true;
                    }
                }
                const strengthSlider = document.querySelector('#dev-' + dev.id + ' .strength-slider');
                if (strengthSlider) {
                    if (strengthEntity && strengthEntity.state !== 'unknown' && strengthEntity.state !== 'unavailable') {
                        const unit = strengthEntity.attributes.unit_of_measurement || '';
                        strengthSlider.value = strengthEntity.state;
                        strengthSlider.disabled = false;
                        const valEl = document.querySelector('#dev-' + dev.id + ' .strength-value');
                        if (valEl) valEl.textContent = strengthEntity.state + unit;
                    } else {
                        strengthSlider.disabled = true;
                    }
                }
                // 状态文本
                let statusText;
                if (coverEntity) {
                    const pos = coverEntity.attributes.position;
                    const state = coverEntity.state;
                    if (state === 'open') statusText = '状态: 打开';
                    else if (state === 'closed' || state === 'close') statusText = '状态: 关闭';
                    else if (state === 'opening') statusText = '状态: 正在打开';
                    else if (state === 'closing') statusText = '状态: 正在关闭';
                    else statusText = '状态: ' + state;
                    if (pos !== undefined) statusText += ' | 位置: ' + pos + '%';
                    const slider = document.querySelector('#dev-' + dev.id + ' .position-slider');
                    if (slider && pos !== undefined) {
                        slider.value = pos;
                        slider.nextElementSibling.textContent = pos + '%';
                    }
                } else {
                    statusText = '状态: 无数据';
                }
                if (onlineEntity) statusText += ' | ' + (onlineEntity.state === 'on' ? '在线' : '离线');
                if (batteryEntity && batteryEntity.state && batteryEntity.state !== 'unknown' && batteryEntity.state !== 'unavailable') {
                    const bUnit = batteryEntity.attributes.unit_of_measurement || 'V';
                    statusText += ' | 电压: ' + batteryEntity.state + bUnit;
                } else if (coverEntity && coverEntity.attributes.voltage) {
                    statusText += ' | 电压: ' + coverEntity.attributes.voltage + 'V';
                }
                stateEl.textContent = statusText;
            } catch (e) {
                stateEl.textContent = '状态: 加载失败';
            }
        }

        async function startPairing(entryId, gatewaySn) {
            if (!confirm('确定要启动网关配对模式吗？\n配对期间请将子设备靠近网关。')) return;
            const statusEl = document.getElementById('gw-status-' + entryId);
            updateGatewayStatus(statusEl, 'pairing');
            try {
                const resp = await haApi('/window_controller_gateway/devices?config_entry_id=' + entryId);
                if (!resp.ok) throw new Error('HA API ' + resp.status);
                const devices = await resp.json();
                const gwDevice = devices.find(d => !d.via_device_id);
                if (!gwDevice) { showToast('未找到网关设备', 'err'); return; }
                const pairResp = await haApi('/services/window_controller_gateway/start_pairing', 'POST', {
                    device_id: gwDevice.id, duration: 60
                });
                if (!pairResp.ok) throw new Error('HA API ' + pairResp.status);
                showToast('配对模式已启动（60秒），请操作子设备', 'ok');
                setTimeout(() => loadGatewayDevices(entryId, gatewaySn), 10000);
                setTimeout(() => loadGatewayDevices(entryId, gatewaySn), 60000);
            } catch (e) {
                showToast('配对启动失败: ' + e.message, 'err');
                updateGatewayStatus(statusEl, 'online');
            }
        }

        async function controlDevice(deviceId, command, entryId, value) {
            if (command === 'remove' && !confirm('确定要删除该子设备吗？\n将移除该设备在 HA 中的全部实体。')) return;
            showToast('正在发送命令: ' + command + '...', 'warn');
            try {
                const resp = await haApi('/states');
                if (!resp.ok) throw new Error('HA API ' + resp.status);
                const states = await resp.json();
                const devResp = await haApi('/window_controller_gateway/devices?config_entry_id=' + entryId);
                if (!devResp.ok) throw new Error('HA API ' + devResp.status);
                const devices = await devResp.json();
                const dev = devices.find(d => d.id === deviceId);
                let sn = '';
                if (dev && dev.identifiers && dev.identifiers.length > 0) {
                    const ident = dev.identifiers[0];
                    if (Array.isArray(ident) && ident.length > 1) sn = ident[1];
                }
                const snSuffix = (sn && sn.length >= 4) ? sn.slice(-6).toLowerCase() : '';
                const coverEntity = snSuffix ? states.find(s =>
                    s.entity_id.startsWith('cover.') && s.entity_id.toLowerCase().includes(snSuffix)
                ) : null;
                if (command === 'open' || command === 'close' || command === 'stop') {
                    if (!coverEntity) {
                        showToast('未找到设备 cover 实体', 'warn');
                    } else {
                        let service = '';
                        if (command === 'open') service = 'open_cover';
                        else if (command === 'close') service = 'close_cover';
                        else if (command === 'stop') service = 'stop_cover';
                        const r = await haApi('/services/cover/' + service, 'POST', { entity_id: coverEntity.entity_id });
                        if (!r.ok) throw new Error('HA API ' + r.status);
                        showToast('命令已发送: ' + command, 'ok');
                    }
                } else if (command === 'wind_lock_tilt' || command === 'wind_lock_flat') {
                    const btnSuffix = command === 'wind_lock_tilt' ? 'wind_lock_tilt' : 'wind_lock_flat';
                    const btnEntity = snSuffix ? states.find(s =>
                        s.entity_id.startsWith('button.') &&
                        s.entity_id.toLowerCase().includes(snSuffix) &&
                        s.entity_id.includes(btnSuffix)
                    ) : null;
                    if (btnEntity) {
                        const r = await haApi('/services/button/press', 'POST', { entity_id: btnEntity.entity_id });
                        if (!r.ok) throw new Error('HA API ' + r.status);
                        showToast('模式切换: ' + (command === 'wind_lock_tilt' ? '内倒' : '平开'), 'ok');
                    } else {
                        showToast('未找到模式按钮实体', 'warn');
                    }
                } else if (command === 'set_speed' || command === 'set_strength') {
                    const numSuffix = command === 'set_speed' ? 'speed' : 'strength';
                    const numEntity = snSuffix ? states.find(s =>
                        s.entity_id.startsWith('number.') && s.entity_id.toLowerCase().includes(snSuffix) && s.entity_id.includes(numSuffix)
                    ) : null;
                    if (numEntity) {
                        const numVal = parseFloat(value);
                        if (isNaN(numVal)) throw new Error('无效数值: ' + value);
                        const r = await haApi('/services/number/set_value', 'POST', { entity_id: numEntity.entity_id, value: numVal });
                        if (!r.ok) throw new Error('HA API ' + r.status);
                        showToast((command === 'set_speed' ? '速度' : '力度') + '设置: ' + value, 'ok');
                    } else {
                        showToast('未找到' + (command === 'set_speed' ? '速度' : '力度') + '实体', 'warn');
                    }
                } else if (command === 'remove') {
                    const btnEntity = snSuffix ? states.find(s =>
                        s.entity_id.startsWith('button.') && s.entity_id.toLowerCase().includes(snSuffix) && s.entity_id.includes('remove')
                    ) : null;
                    if (btnEntity) {
                        const r = await haApi('/services/button/press', 'POST', { entity_id: btnEntity.entity_id });
                        if (!r.ok) throw new Error('HA API ' + r.status);
                        showToast('删除命令已发送', 'ok');
                    } else {
                        showToast('未找到删除按钮实体', 'warn');
                    }
                } else {
                    showToast('未知命令: ' + command, 'warn');
                }
                setTimeout(() => loadGatewayDevices(entryId, GATEWAY_SN_BY_ENTRY[entryId] || ''), 2000);
            } catch (e) {
                showToast('控制失败: ' + e.message, 'err');
            }
        }

        async function controlDevicePosition(deviceId, position, entryId) {
            try {
                const resp = await haApi('/states');
                if (!resp.ok) throw new Error('HA API ' + resp.status);
                const states = await resp.json();
                const devResp = await haApi('/window_controller_gateway/devices?config_entry_id=' + entryId);
                if (!devResp.ok) throw new Error('HA API ' + devResp.status);
                const devices = await devResp.json();
                const dev = devices.find(d => d.id === deviceId);
                let sn = '';
                if (dev && dev.identifiers && dev.identifiers.length > 0) {
                    const ident = dev.identifiers[0];
                    if (Array.isArray(ident) && ident.length > 1) sn = ident[1];
                }
                const snSuffix = (sn && sn.length >= 4) ? sn.slice(-6).toLowerCase() : '';
                const coverEntity = snSuffix ? states.find(s =>
                    s.entity_id.startsWith('cover.') && s.entity_id.toLowerCase().includes(snSuffix)
                ) : null;
                if (coverEntity) {
                    // 集成未注册 cover.set_cover_position（cover.py 无 SET_POSITION 特性标志），

                    const r = await haApi('/services/window_controller_gateway/set_position', 'POST', {

        }

        // ========== 检查更新 ==========
        async function checkForUpdates() {
            const card = document.getElementById('updateCard');
            const content = document.getElementById('updateContent');
            card.style.display = 'block';
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在检查更新...</p></div>';
            try {
                // 使用 nginx 代理访问 GitHub API，避免 Ingress iframe CSP 拦截外部请求
                const resp = await fetch(INGRESS_BASE + 'api/github/repos/fangwenyi-dev/ha-gateway-plugin/releases/latest');
                if (!resp.ok) throw new Error('GitHub API 不可用 (HTTP ' + resp.status + ')');
                const release = await resp.json();
                const latestVersion = release.tag_name.replace(/^v/, '');
                const hasUpdate = compareVersions(latestVersion, CURRENT_VERSION) > 0;
                if (hasUpdate) {
                    const body = release.body || '暂无变更日志';
                    const truncatedBody = body.length > 800 ? body.substring(0, 800) + '...' : body;
                    content.innerHTML = '<div class="update-box"><div class="update-info">' +
                        '<div class="update-title">发现新版本 v' + escapeHtml(latestVersion) + '</div>' +
                        '<div class="update-desc">当前版本 v' + CURRENT_VERSION + '</div></div>' +
                        '<button class="btn btn-success" onclick="doUpgrade()">一键升级</button>' +
                        '<a class="btn btn-primary" href="' + escapeHtml(release.html_url) + '" target="_blank">查看详情</a></div>' +
                        '<div style="margin-top:10px;font-size:12px;color:var(--text-muted);white-space:pre-wrap;">' + escapeHtml(truncatedBody) + '</div>';
                } else {
                    content.innerHTML = '<div class="update-box" style="background:linear-gradient(135deg,var(--green-bg),#d1fae5);"><div class="update-info">' +
                        '<div class="update-title" style="color:#065f46;">已是最新版本 v' + CURRENT_VERSION + '</div>' +
                        '<div class="update-desc">GitHub 最新版本: v' + escapeHtml(latestVersion) + '</div></div></div>';
                }
            } catch (e) {
                content.innerHTML = '<div class="update-box" style="background:var(--red-bg);"><div class="update-info">' +
                    '<div class="update-title" style="color:#991b1b;">检查更新失败</div>' +
                    '<div class="update-desc">' + escapeHtml(e.message) + '</div></div></div>';
            }
        }

        // ========== 一键升级 ==========
        async function doUpgrade() {
            if (!confirm('确定要一键升级插件吗？\n\n升级过程：\n1. 调用 HA Supervisor 更新插件\n2. 更新完成后需重启插件\n3. 重启后自动安装最新集成代码\n\n升级期间插件会短暂不可用。')) return;
            showToast('正在执行一键升级...', 'warn');
            try {
                // 使用 /addons/self/update（免 admin 权限路径，Supervisor 自动识别调用者）
                // 原用 /addons/{slug}/update 需要 hassio_api: true + admin 角色，addon token 无权限返回 403
                const resp = await fetch(INGRESS_BASE + 'api/supervisor/addons/self/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ backup: false })
                });
                const data = await resp.json().catch(() => ({}));
                const msg = data.message || '';
                if (resp.ok && data.result === 'ok') {
                    showToast('升级完成，正在刷新…', 'ok');
                    setTimeout(() => { window.location.reload(); }, 1500);
                } else if (/already.*(latest|up.to.date)|nothing to do/i.test(msg)) {
                    showToast('已是最新版本', 'warn');
                } else if (/job.*running|in progress|another (update|job)/i.test(msg)) {
                    showToast('已有任务进行中，请稍后再试', 'warn');
                } else if (/abort/i.test(msg)) {
                    showToast('升级已中止', 'warn');
                } else {
                    showToast('升级失败: ' + (msg || 'HTTP ' + resp.status), 'err');
                }
            } catch (e) {
                showToast('升级请求失败: ' + e.message, 'err');
            }
        }

        // ========== 工具函数 ==========
        function compareVersions(v1, v2) {
            const parts1 = v1.split('.').map(Number);
            const parts2 = v2.split('.').map(Number);
            for (let i = 0; i < Math.max(parts1.length, parts2.length); i++) {
                const p1 = parts1[i] || 0, p2 = parts2[i] || 0;
                if (p1 > p2) return 1;
                if (p1 < p2) return -1;
            }
            return 0;
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        // HTML 解析器会在 JS 编译前解码 &#39;，实体转义保护不了单引号包裹的 onclick/onchange 参数，需额外转义
        function jsQuote(v) {
            return String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'ok');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ========== 启动 ==========
        init();
        setInterval(refreshAll, 30000);
    </script>
</body>
</html>
