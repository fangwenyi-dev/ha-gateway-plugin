# 开窗器网关服务定义

start_pairing:
  name: 开始配对
  description: 启动网关的配对模式以添加新设备
  fields:
    device_id:
      name: 设备ID
      description: 网关设备的唯一标识符
      required: true
      example: "window_gateway_123456"
      selector:
        text:
    duration:
      name: 持续时间
      description: 本地兜底超时（秒，10-300）。协议 003 报文不携带时长，此项只决定 HA 侧等待配对确认多久后放弃；网关自身配对窗口按固件时序关闭
      default: 60
      selector:
        number:
          min: 10
          max: 300
          step: 5
          unit_of_measurement: 秒

refresh_devices:
  name: 刷新设备
  description: 兼容性保留的空操作服务——协议规定设备列表由网关 002/005 主动上报驱动，HA 无法触发重新发现；本调用仅记录日志（v1.6.19 描述纠偏，行为未变）
  fields:
    device_id:
      name: 设备ID
      description: 网关设备的唯一标识符
      required: true
      example: "window_gateway_123456"
      selector:
        text:

set_position:
  name: 设置位置
  description: 设置特定窗帘/窗户的位置
  fields:
    device_id:
      name: 设备ID
      description: 窗帘设备的唯一标识符
      required: true
      selector:
        text:
    position:
      name: 位置
      description: 目标位置（0-100）
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

check_gateway_status:
  name: 检查网关状态
  description: 查询并记录网关在线状态（依据最近上报时间判定），不改变任何实体/连接状态；结果写入日志（device_id 与 gateway_sn 至少提供一个）
  fields:
    device_id:
      name: 设备ID
      description: 网关设备的唯一标识符（与 gateway_sn 二选一）
      required: false
      example: "window_gateway_123456"
      selector:
        text:
    # v1.6.4：Web UI 实际以 gateway_sn 调用（Python schema 一直支持），
    # 补齐元数据消除开发者工具与真实调用形态的漂移
    gateway_sn:
      name: 网关SN
      description: 网关序列号（与 device_id 二选一）
      required: false
      example: "100121501186"
      selector:
        text:

rename_device:
  name: 重命名设备
  description: 重命名子设备名称，支持自定义房间/位置名称
  fields:
    device_id:
      name: 设备ID
      description: 子设备的唯一标识符
      required: true
      example: "100121501186"
      selector:
        text:
    name:
      name: 新名称
      description: 设备的新名称（如"客厅窗户"）
      required: true
      example: "客厅窗户"
      selector:
        text:

transfer_device:
  name: 转移设备
  description: 将单个设备从一个网关转移到另一个网关
  fields:
    device_id:
      name: 设备ID
      description: 要转移的设备ID
      required: true
      example: "500534380259"
      selector:
        text:
    new_gateway_sn:
      name: 目标网关SN
      description: 目标网关的序列号
      required: true
      example: "100122501203"
      selector:
        text:
