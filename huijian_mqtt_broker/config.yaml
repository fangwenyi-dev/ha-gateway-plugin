name: 慧尖 LoRa 网关
version: "1.1.0"
slug: huijian_mqtt_broker
description: 慧尖开窗器 LoRa 网关一体化插件，内置 Mosquitto Broker + 网关集成，安装即用
url: 'https://github.com/fangwenyi-dev/ha-gateway-plugin'
arch:
  - amd64
  - aarch64
init: false
startup: system
watchdog: tcp://[HOST]:1885
services:
  - mqtt:provide
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: 慧尖网关
ports:
  1885/tcp: 1885
ports_description:
  1885/tcp: MQTT TCP 端口（LoRa 网关和 HA MQTT 集成连接，默认 1885 避免与 HA 官方 MQTT 冲突）
map:
  - ssl
  - homeassistant_config:rw
options:
  username: huijian
  password: huijian2022
  mqtt_port: 1885
  auto_setup_ha_mqtt: true
  install_integration: true
schema:
  username: str
  password: str
  mqtt_port: port
  auto_setup_ha_mqtt: bool
  install_integration: bool
