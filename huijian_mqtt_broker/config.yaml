name: 慧尖 LoRa 网关
version: "1.0.2"
slug: huijian_mqtt_broker
description: 慧尖开窗器 LoRa 网关一体化插件，内置 Mosquitto Broker + mDNS 广播 + 网关集成，安装即用
arch:
  - amd64
  - aarch64
init: false
host_network: true
startup: system
watchdog: tcp://[HOST]:1883
services:
  - mqtt:provide
ports:
  1883/tcp: 1883
ports_description:
  1883/tcp: MQTT TCP 端口（LoRa 网关和 HA MQTT 集成连接）
map:
  - ssl
  - homeassistant_config:rw
options:
  username: huijian
  password: huijian2022
  auto_setup_ha_mqtt: true
  mdns_hostname: huijian
  install_integration: true
schema:
  username: str
  password: str
  auto_setup_ha_mqtt: bool
  mdns_hostname: str
  install_integration: bool
