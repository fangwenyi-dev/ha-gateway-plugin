name: 慧尖 LoRa 网关
version: "1.3.7"
slug: huijian_mqtt_broker
description: 慧尖开窗器 LoRa 网关一体化插件，内置 Mosquitto Broker + 网关集成，安装即用
url: 'https://github.com/fangwenyi-dev/ha-gateway-plugin'
arch:
  - amd64
  - aarch64
init: false
startup: system
watchdog: tcp://[HOST]:2022
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: 慧尖网关
# ---------------------------------------------------------------------------
# host_network: true — 让容器与宿主机共享网络命名空间
#
# 为什么需要：
#   LoRa 网关固件硬编码 huijian.local，通过 mDNS 解析 broker 地址。
#   Docker bridge 网络下容器的 avahi-daemon 无法向物理 LAN 广播 mDNS，
#   导致 huijian.local 无法解析。启用 host_network 后 avahi-daemon
#   直接在宿主机网卡上广播 mDNS，huijian.local 解析到宿主机 IP。
#
# ports 映射不再需要：
#   host_network 下容器直接使用宿主机网络，Mosquitto 监听 0.0.0.0:2022
#   等同于宿主机 0.0.0.0:2022，无需 Docker 端口映射。
#
# avahi 冲突处理：
#   HAOS 宿主自身运行 avahi-daemon（广播 homeassistant.local），
#   run.sh 会检测并处理冲突：优先停止宿主 avahi，再启动容器 avahi
#   广播 huijian.local + _mqtt._tcp 服务。
# ---------------------------------------------------------------------------
host_network: true
full_access: true
# 允许通过 Supervisor /core/api/ 代理访问 HA Core REST API（设备、状态、服务等）
# Web UI 的 haApi() 调用依赖此权限，否则返回 401
homeassistant_api: true
# 允许 add-on token 访问 Supervisor 管理 API（/addons/*、/supervisor/* 等）
# Web UI「一键升级」POST /api/supervisor/addons/self/update 依赖此权限，
# 缺失时 Supervisor 拒绝访问并返回 403 Forbidden
hassio_api: true
ports:
  2022/tcp: MQTT Broker 端口（host_network 模式下直接暴露在宿主机 2022）
map:
  - ssl
  - homeassistant_config:rw
options:
  username: huijian
  password: huijian2022
  auto_setup_ha_mqtt: true
  install_integration: true
schema:
  username: str
  password: str
  auto_setup_ha_mqtt: bool
  install_integration: bool
