name: 慧尖 LoRa 网关
version: "1.7.11"
slug: huijian_mqtt_broker
description: 慧尖开窗器 LoRa 网关一体化插件，内置 Mosquitto Broker + 网关集成，安装即用
url: 'https://github.com/fangwenyi-dev/ha-gateway-plugin'
arch:
  - amd64
  - aarch64
init: false
startup: system
watchdog: tcp://[HOST]:2022
ingress: true
ingress_port: 8099
panel_icon: mdi:leaf-circle-outline
panel_title: 慧尖网关
# host_network: 容器直接使用主机网络，mosquitto 监听主机 2022 端口
# mDNS (zeroconf) 广播可到达物理 LAN，LoRa 网关通过 huijian.local 自动发现
# Python zeroconf 使用普通 UDP socket 广播，不需要设备级访问权限
# 允许经 nginx 注入 token 走 /core/api/ 代理访问 HA Core REST API（设备、状态、服务等）
# Web UI 的 haApi() 调用依赖此权限，否则返回 401
homeassistant_api: true
# v1.6.3：移除 hassio_api。Web UI 已零调用 Supervisor 管理 API——
# 插件自更新被 Supervisor 安全设计禁止（/addons/self/update 恒 403，实测定案），
# 旧的「一键升级依赖此权限」注释不实；/api/supervisor/ 死代理已随 run.sh 删除。
# 权限最小化：不再需要就声明，降低 token 泄露影响面。
host_network: true
# v1.6.4 定案：启用预构建镜像——安装/升级从"NAS 现场 apk+pip 编译(慢网挂死)"
# 变为"匿名拉 ghcr 几十秒"。CI 每次 push 构建 {arch}-huijian-mqtt-broker:
# {version}+latest，Supervisor 按 config 版本号拉取对应 tag。
# 包 public 化定案（2026-08-29 实验实锤）：GitHub 无 visibility 变更 API
# （REST/GraphQL 全路径实测），但 Actions 用 GITHUB_TOKEN 首推的包【继承
# 仓库可见性】——public 仓库⇒包自动 public。旧包 private 是 8-25 仓库当天
# 本地手工 docker push 创建所致（可见性创建时定死，后续推版本不改）。
# 修复手段即：删包→CI 重建（无需任何人工网页点击）。
# v1.6.16 初版加速：image 改指南京大学透传 ghcr.nju.edu.cn。
# v1.6.18 曾主源切毫秒镜像 ghcr.1ms.run（实测 5MB/s 全镜像≈10s）。
# v1.6.20 定案：主源回退 ghcr.io 源站。两个国内镜像站被实测否决——
# ghcr.1ms.run 认证端点持续故障（"专属域名获取失败"）；ghcr.nju.edu.cn 对
# aarch64 新 tag 的 21MB 大层回源近冻结（实测 4.3KB/s→311B/s 递减，"假活
# 慢滴"比明确失败更折磨用户）。源站实测 216KB/s 稳定，42MB 约 3-4 分钟。
# 追求首包极致的用户可在本加载项「配置→镜像(Image)」覆盖为任一镜像站
# （可用性随时间波动，不作默认保证）；CI warm-mirrors 仍尽力预热备源。
# v1.6.19 主源【回退 nju】——1ms 定案翻车复盘（2026-09-03 发版实测）：
# 1ms 是多边缘 LB 架构，对【新 tag 冷缓存】各边缘未同步完成前返回 404，
# 且 200/404 按边缘闪断、分钟~小时级才自愈——"发版后首装"这一最需要用
# 加速的场景恰是它最不可用的窗口；CI warm-mirrors 预热也无法根治（预热
# 只打到部分边缘）。nju 是同步 pull-through：慢（0.02~0.1MB/s，42MB 需
# 数分钟）但回源确定性 200，不存在假 404——首装体验"慢而稳"优于"快而
# 随机失败"。1ms 降级为【手动快通道】：老版本 tag 已被缓存后，求快可在
# 加载项配置「镜像(Image)」覆盖为 ghcr.1ms.run/...（路径不变）。
# 家宽实测参照：ghcr.io 直连 ~84KB/s（≈8min 且常超时）；nju 0.02~0.1MB/s；
# 1ms 热缓存时 4.6~5.2MB/s。镜像本体始终单份推 ghcr.io，透传站按需回源。
# CI warm-mirrors 作业保留：发版后低频预热 nju+1ms（尽力而为，不阻塞发布）。
# 局限定案：Supervisor image 只支持单一 URL、无原生多源超时故障转移——
# 镜像站故障时手动换源：加载项详情页「配置→高级→镜像(Image)」覆盖域名
# （路径不变），备选 ghcr.nju.edu.cn → ghcr.1ms.run(热缓存后) → ghcr.io(源站
# 需自备加速)；另商店元数据有缓存，改源/升级前先在商店 ⋮→检查更新刷新。
image: ghcr.io/fangwenyi-dev/{arch}-huijian-mqtt-broker
# v1.6.12（第五轮审计）：移除 ssl 挂载——全仓（run.sh/Dockerfile/mosquitto.conf/
# 集成/Web）对 /ssl 零引用，broker 也未启用 TLS；与 v1.6.3 移除 hassio_api 时
# 自立的"权限最小化：不需要就不声明"准则对齐（保留的 homeassistant_config:rw
# 为持久化数据与集成回链真实依赖，非死映射）
map:
  - homeassistant_config:rw
options:
  username: huijian
  password: huijian2022
  auto_setup_ha_mqtt: true
  install_integration: true
  # v1.6.26（D-3）：共存桥总开关。判据是"本机 :1883 有进程 LISTEN"即自动
  # 向对端搭方向分离桥（v1.6.24 零配置语义）。谨慎用户或宿主上跑有第三方
  # 1883 服务时置 false 熔断：不建新桥、已建桥自动拆除。纯慧尖用户保持
  # 默认 true 即零感知。
  coexist_bridge_enabled: true
  # v1.6.24 引入（未单独发布，随 v1.6.25 首发——此前注释被版本 bump 的
  # 全局 sed 漂成过"v1.6.25"，v1.6.26 订正归属）：官方「Mosquitto broker」
  # 加载项 7.x+ 强制认证时须填其任一有效账号（配置页 logins 添加的），
  # 桥才连得上；留空=匿名桥，兼容老版官方或 customize 关认证场景。
  # ⚠️ 两字段必须成对填写——v1.6.26（D-2）起半填形态按匿名桥降级
  # （旧版会写出 `password ` 空值行导致 mosquitto 整份 conf 拒载）。
  # 纯慧尖用户永远无需理会本项。
  coexist_official_user: ""
  coexist_official_password: ""
  # v1.7.11 快速自动发现：容器内代理订阅 gateway/rpt_rsp，捕获网关上报即
  # 经 Supervisor API 代发起发现流程——全新 HA（从未添加过集成）也能秒级在
  # 「设置→设备与服务」出现"慧尖网关"发现卡片（此前必须先手动添加一次
  # 集成才会有耳朵听上报）。置 false 回退传统发现路径。用户确认权不变：
  # 卡片仍需本人点击配对，代理绝不自动建条目。
  fast_auto_discovery: true
schema:
  username: str
  # password 类型：Supervisor 配置页输入框脱敏显示（str 会明文回显在设置页）。
  # 注意 Supervisor 会对已保存值做脱敏存储，UI 显示 * 属正常
  password: password
  auto_setup_ha_mqtt: bool
  install_integration: bool
  coexist_bridge_enabled: bool
  coexist_official_user: str?
  coexist_official_password: password?
  fast_auto_discovery: bool
