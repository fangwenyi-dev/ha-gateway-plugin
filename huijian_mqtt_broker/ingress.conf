server {
    listen 8099;
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/status {
        add_header Content-Type application/json;
        return 200 '{"status":"running","broker":"mosquitto","port":1883}';
    }
}
